<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F7F3E8;
  --paper-dim:#EFE8D4;
  --card:#FFFDF8;
  --ink:#16324F;
  --ink-soft:#4B6479;
  --ink-faint:#8598A8;
  --red:#C1443C;
  --blue:#2A6F8E;
  --gold:#C9972F;
  --green:#4C7A5E;
  --line:rgba(22,50,79,0.14);
  --line-strong:rgba(22,50,79,0.28);
  --font-display:'Space Grotesk',sans-serif;
  --font-body:'IBM Plex Sans',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
  --radius:10px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-body);
  background:var(--paper);
  color:var(--ink);
  min-height:100vh;
  background-image:
    radial-gradient(circle at 1px 1px, rgba(22,50,79,0.06) 1px, transparent 0);
  background-size:22px 22px;
}
::selection{background:var(--gold);color:var(--ink);}
a{color:var(--blue);}
button{font-family:var(--font-body);cursor:pointer;}
input,select,textarea{font-family:var(--font-body);}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;}

/* Layout */
.app{display:flex;min-height:100vh;}
.sidebar{
  width:236px;flex-shrink:0;
  background:var(--ink);
  color:#EFE8D4;
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.sidebar-brand{
  padding:22px 20px 16px;
  border-bottom:1px dashed rgba(239,232,212,0.25);
}
.sidebar-brand .kicker{
  font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;
  color:var(--gold);text-transform:uppercase;
}
.sidebar-brand h1{
  font-family:var(--font-display);font-size:22px;margin:4px 0 0;font-weight:700;
  letter-spacing:-0.02em;
}
.sidebar-brand .tagline{font-size:11px;color:#9FB2C2;margin-top:3px;font-style:italic;}

.board{padding:10px 0 20px;}
.board-label{
  font-family:var(--font-mono);font-size:9.5px;letter-spacing:.16em;color:#7C93A5;
  text-transform:uppercase;padding:12px 20px 6px;
}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 20px;font-size:13.5px;color:#DCE4EA;
  border-left:3px solid transparent;
  font-family:var(--font-mono);
  transition:background .12s ease;
}
.nav-item .ic{width:16px;text-align:center;font-size:13px;opacity:.85;}
.nav-item:hover{background:rgba(255,255,255,0.05);cursor:pointer;}
.nav-item.active{background:rgba(201,151,47,0.14);border-left-color:var(--gold);color:#fff;}
.nav-item.locked{opacity:.35;cursor:not-allowed;}
.nav-item.locked:hover{background:none;}

.trip-pill{
  margin:14px 16px 0;padding:10px 12px;border-radius:8px;
  background:rgba(255,255,255,0.06);border:1px dashed rgba(239,232,212,0.3);
  font-family:var(--font-mono);font-size:11px;color:#B9C7D2;
}
.trip-pill b{display:block;color:#fff;font-family:var(--font-display);font-size:14px;margin-bottom:2px;}

.main{flex:1;min-width:0;padding:26px 34px 60px;max-width:1180px;}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;gap:16px;flex-wrap:wrap;}
.crumb{font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.08em;}
h2.view-title{font-family:var(--font-display);font-size:28px;margin:2px 0 0;letter-spacing:-0.01em;}
.view-sub{color:var(--ink-soft);font-size:13.5px;margin-top:4px;max-width:640px;}

.trip-switcher{display:flex;align-items:center;gap:8px;}
select.trip-select{
  font-family:var(--font-mono);font-size:12.5px;padding:8px 10px;border-radius:7px;
  border:1px solid var(--line-strong);background:var(--card);color:var(--ink);
}
.btn{
  font-family:var(--font-mono);font-size:12px;padding:8px 14px;border-radius:7px;
  border:1px solid var(--line-strong);background:var(--card);color:var(--ink);
  display:inline-flex;align-items:center;gap:6px;letter-spacing:.02em;
}
.btn:hover{border-color:var(--ink);}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.btn.primary:hover{background:#0d2135;}
.btn.danger{color:var(--red);border-color:rgba(193,68,60,0.4);}
.btn.danger:hover{background:rgba(193,68,60,0.08);}
.btn.small{padding:5px 10px;font-size:11px;}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#2b220a;}

/* Cards / sections */
.section{margin-bottom:30px;}
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;}
.section-head h3{font-family:var(--font-display);font-size:16.5px;margin:0;letter-spacing:-0.01em;}
.section-head .hint{font-size:11.5px;color:var(--ink-faint);font-family:var(--font-mono);}

.grid{display:grid;gap:16px;}
.grid.cols-2{grid-template-columns:1fr 1fr;}
.grid.cols-3{grid-template-columns:repeat(3,1fr);}
.grid.cols-4{grid-template-columns:repeat(4,1fr);}
@media(max-width:900px){.grid.cols-2,.grid.cols-3,.grid.cols-4{grid-template-columns:1fr;}}

.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 18px;
}
.stat-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;}
.stat-card .n{font-family:var(--font-display);font-size:26px;font-weight:700;}
.stat-card .l{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.08em;margin-top:2px;}

/* Boarding pass trip card - signature element */
.pass{
  position:relative;background:var(--card);border:1px solid var(--line-strong);
  border-radius:12px;display:flex;overflow:hidden;cursor:pointer;
  transition:transform .12s ease, box-shadow .12s ease;
}
.pass:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(22,50,79,0.12);}
.pass-main{flex:1;padding:16px 18px;min-width:0;}
.pass-stub{
  width:112px;flex-shrink:0;padding:16px 10px;background:var(--ink);color:var(--paper);
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  position:relative;
}
.pass-divider{
  width:0;border-left:2px dashed rgba(22,50,79,0.3);position:relative;
}
.pass-divider::before,.pass-divider::after{
  content:"";position:absolute;left:-9px;width:18px;height:18px;border-radius:50%;background:var(--paper);
}
.pass-divider::before{top:-9px;}
.pass-divider::after{bottom:-9px;}
.pass-eyebrow{font-family:var(--font-mono);font-size:10px;color:var(--gold);letter-spacing:.12em;text-transform:uppercase;}
.pass-dest{font-family:var(--font-display);font-size:20px;font-weight:700;margin:2px 0 6px;letter-spacing:-0.01em;}
.pass-meta{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--font-mono);font-size:11.5px;color:var(--ink-soft);}
.pass-meta span b{color:var(--ink);}
.pass-stub .count{font-family:var(--font-display);font-size:26px;font-weight:700;color:var(--gold);}
.pass-stub .count-l{font-family:var(--font-mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;opacity:.8;margin-top:2px;}
.pass-progress{margin-top:10px;height:5px;border-radius:3px;background:var(--paper-dim);overflow:hidden;}
.pass-progress i{display:block;height:100%;background:var(--green);}

.empty{
  border:1.5px dashed var(--line-strong);border-radius:var(--radius);padding:34px 20px;
  text-align:center;color:var(--ink-soft);font-size:13.5px;
}
.empty .big{font-family:var(--font-display);font-size:17px;color:var(--ink);margin-bottom:6px;}

/* forms */
.field{margin-bottom:12px;}
.field label{display:block;font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-faint);margin-bottom:5px;}
.field input,.field select,.field textarea{
  width:100%;padding:9px 11px;border:1px solid var(--line-strong);border-radius:7px;
  background:var(--card);color:var(--ink);font-size:13.5px;
}
.field textarea{resize:vertical;min-height:64px;font-family:var(--font-body);}
.row-inline{display:flex;gap:10px;}
.row-inline .field{flex:1;}

table{width:100%;border-collapse:collapse;font-size:13px;}
th{
  text-align:left;font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;
  color:var(--ink-faint);padding:8px 10px;border-bottom:1px solid var(--line-strong);
}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
td input,td select{border:1px solid transparent;background:transparent;padding:5px 6px;border-radius:5px;width:100%;font-size:13px;}
td input:hover,td select:hover{border-color:var(--line-strong);}
td input:focus,td select:focus{border-color:var(--blue);background:var(--card);}
.num{font-family:var(--font-mono);}
.total-row td{font-family:var(--font-mono);font-weight:600;border-top:2px solid var(--ink);background:var(--paper-dim);}

.tag{
  display:inline-flex;align-items:center;gap:5px;font-family:var(--font-mono);font-size:10.5px;
  padding:3px 9px;border-radius:20px;border:1px solid var(--line-strong);color:var(--ink-soft);
}
.tag.on{background:var(--green);border-color:var(--green);color:#fff;}
.tag.warn{background:var(--red);border-color:var(--red);color:#fff;}

.checklist-item{
  display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line);
}
.checklist-item:last-child{border-bottom:none;}
.checklist-item input[type=checkbox]{width:17px;height:17px;accent-color:var(--green);flex-shrink:0;}
.checklist-item.checked span.txt{text-decoration:line-through;color:var(--ink-faint);}
.checklist-item span.txt{flex:1;font-size:13.5px;}
.checklist-item .del{opacity:0;color:var(--red);font-size:14px;background:none;border:none;padding:2px 6px;}
.checklist-item:hover .del{opacity:1;}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line-strong);margin-bottom:16px;flex-wrap:wrap;}
.tab{
  font-family:var(--font-mono);font-size:11.5px;padding:8px 14px;color:var(--ink-soft);
  border-bottom:2px solid transparent;text-transform:uppercase;letter-spacing:.05em;
}
.tab:hover{color:var(--ink);cursor:pointer;}
.tab.active{color:var(--ink);border-bottom-color:var(--gold);font-weight:600;}

.stamp{
  display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:50%;
  border:2.5px solid var(--green);color:var(--green);font-family:var(--font-mono);font-size:9px;
  text-transform:uppercase;letter-spacing:.03em;text-align:center;transform:rotate(-8deg);flex-shrink:0;
  line-height:1.15;
}

.dayblock{border:1px solid var(--line);border-radius:var(--radius);margin-bottom:14px;overflow:hidden;}
.daybar{
  display:flex;align-items:center;justify-content:space-between;padding:10px 16px;
  background:var(--paper-dim);border-bottom:1px solid var(--line);
}
.daybar .dnum{font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);text-transform:uppercase;}
.daybar .ddate{font-family:var(--font-display);font-size:15px;font-weight:600;}
.dayslots{display:grid;grid-template-columns:repeat(3,1fr);gap:0;}
@media(max-width:900px){.dayslots{grid-template-columns:1fr;}}
.dayslot{padding:12px 16px;border-right:1px solid var(--line);}
.dayslot:last-child{border-right:none;}
.dayslot .slotlabel{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;color:var(--gold);letter-spacing:.08em;margin-bottom:6px;}
.dayslot textarea{width:100%;border:none;background:transparent;font-size:13px;min-height:52px;resize:vertical;padding:0;font-family:var(--font-body);color:var(--ink);}
.dayextra{padding:10px 16px;border-top:1px dashed var(--line-strong);display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
@media(max-width:900px){.dayextra{grid-template-columns:1fr 1fr;}}
.dayextra .field{margin:0;}
.dayextra label{font-size:9.5px;}
.dayextra input{padding:6px 8px;font-size:12px;}

.pack-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
.pack-tab{
  font-family:var(--font-mono);font-size:11px;padding:7px 13px;border-radius:20px;
  border:1px solid var(--line-strong);color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;
}
.pack-tab.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.pack-tab:hover{cursor:pointer;border-color:var(--ink);}

.addrow{display:flex;gap:8px;margin-top:10px;}
.addrow input{flex:1;padding:8px 10px;border:1px solid var(--line-strong);border-radius:7px;font-size:13px;}

.bl-group{margin-bottom:18px;}
.bl-group h4{font-family:var(--font-display);font-size:14.5px;margin:0 0 8px;padding-bottom:6px;border-bottom:1px dashed var(--line-strong);}

.muted{color:var(--ink-faint);}
.mono{font-family:var(--font-mono);}
.flex-between{display:flex;align-items:center;justify-content:space-between;}
.gap8{gap:8px;}
.mt8{margin-top:8px;}
.mt16{margin-top:16px;}

.footer-note{margin-top:40px;padding-top:16px;border-top:1px dashed var(--line-strong);font-family:var(--font-mono);font-size:10.5px;color:var(--ink-faint);text-align:center;}

::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:6px;}

.modal-backdrop{
  position:fixed;inset:0;background:rgba(22,50,79,0.5);display:flex;align-items:center;justify-content:center;
  z-index:100;padding:20px;
}
.modal{background:var(--paper);border-radius:12px;padding:26px;max-width:460px;width:100%;border:1px solid var(--line-strong);
  max-height:88vh;overflow-y:auto;}
.modal h3{font-family:var(--font-display);margin:0 0 16px;font-size:19px;}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}

@media(max-width:820px){
  .app{flex-direction:column;}
  .sidebar{width:100%;height:auto;position:relative;flex-direction:row;overflow-x:auto;}
  .sidebar-brand{display:none;}
  .board{display:flex;padding:10px;}
  .board-label{display:none;}
  .main{padding:20px 16px 50px;}
  .pass{flex-direction:column;}
  .pass-divider{display:none;}
  .pass-stub{width:100%;flex-direction:row;justify-content:space-between;padding:10px 16px;}
}
</style>
</head>
<body>
<div id="root"></div>
<script>
/* ============ UTILITIES ============ */
function uid(){return Math.random().toString(36).slice(2,10);}
function todayStr(){return new Date().toISOString().slice(0,10);}
function addDays(dateStr,n){const d=new Date(dateStr+'T00:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);}
function daysBetween(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000);}
function fmtDate(d){if(!d)return '—';const dt=new Date(d+'T00:00:00');return dt.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}
function fmtMoney(n,cur){n=Number(n)||0;return (cur||'USD')+' '+n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});}
function esc(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

/* ============ DEFAULT DATA ============ */
const PACKING_TEMPLATES = {
 'Beach': ['Swimsuits','Sunscreen SPF50','Beach towel','Flip-flops','Sunglasses','Wide-brim hat','Cover-up','Waterproof phone pouch','Aloe vera gel','Light breathable clothing'],
 'Winter': ['Thermal base layers','Insulated jacket','Wool socks','Beanie','Gloves','Scarf','Snow boots','Hand warmers','Heavy moisturizer','Lip balm'],
 'Hiking': ['Hiking boots','Moisture-wicking shirts','Trekking poles','Backpack rain cover','First-aid kit','Water bladder/bottles','Trail snacks','Headlamp','Blister plasters','Offline map / GPS'],
 'Business': ['Suit / blazer','Dress shirts','Formal shoes','Laptop + charger','Business cards','Portfolio / notebook','Tie & accessories','Garment bag','Phone charger','Presentation materials'],
 'Weekend': ['2 outfits','Toiletry bag','Phone charger','Comfortable shoes','Light jacket','Book / entertainment','Reusable water bottle','Snacks','Cash & cards','Sunglasses'],
 'Digital Nomad': ['Laptop + charger','Universal adapter','Portable monitor','Noise-canceling headphones','SIM card / eSIM','Power bank','Ergonomic mouse','Backup drive','Work ID / badge','Cable organizer'],
 'Backpacking': ['Backpack (40–60L)','Packing cubes','Quick-dry towel','Sleeping bag liner','Padlock','Universal adapter','Reusable water bottle','Basic first-aid kit','Laundry soap sheets','Earplugs'],
 'Luxury Vacation': ['Formal evening wear','Statement jewelry','Designer accessories','Premium skincare set','Dress shoes / heels','Silk sleepwear','Travel jewelry case','Signature perfume / cologne','Good camera','Spa essentials']
};
const DOC_DEFAULTS = ['Passport','Visa','Travel Insurance','Flight Tickets','Hotel Confirmations','Vaccination Records'];
const BUDGET_CATEGORIES = ['Flights','Hotels','Food','Shopping','Transport','Activities','Unexpected'];

function newPackingLists(){
  const out={};
  Object.keys(PACKING_TEMPLATES).forEach(t=>{ out[t]=PACKING_TEMPLATES[t].map(text=>({id:uid(),text,checked:false})); });
  return out;
}
function newDocs(){ return DOC_DEFAULTS.map(name=>({id:uid(),name,status:'todo'})); }

function makeTrip(overrides){
  return Object.assign({
    id: uid(), emoji:'✈️', name:'', destinationCity:'', destinationCountry:'',
    startDate:'', endDate:'', currency:'USD', budgetTotal:0,
    destination:{overview:'',currency:'',language:'',emergency:'',transport:'',visa:'',etiquette:'',mustVisit:[]},
    itinerary:[], budget:[], packing:{selected:'Beach', lists:newPackingLists()},
    flights:[], weather:{note:'',tempLow:'',tempHigh:'',conditions:''},
    documents:newDocs(), memories:[],
    nomad:{visaTracker:'',coworking:'',sim:'',internetSpeed:'',cafes:'',monthlyExpenses:'',timezone:'',workSchedule:''},
    creator:{calendar:[],shots:[],ideas:[],affiliates:[],collabs:[],costs:[]}
  }, overrides||{});
}

function defaultData(){
  const start = addDays(todayStr(), 34);
  const end = addDays(todayStr(), 43);
  const trip = makeTrip({
    name:'Tokyo Autumn', emoji:'🍁', destinationCity:'Tokyo', destinationCountry:'Japan',
    startDate:start, endDate:end, currency:'JPY', budgetTotal:2400,
    destination:{
      overview:'A 10-day loop through Tokyo with a side trip to Hakone for the autumn colors.',
      currency:'Japanese Yen (¥)', language:'Japanese — basic greetings go a long way',
      emergency:'Police 110 · Ambulance/Fire 119', transport:'Get a Suica/Pasmo IC card for trains and buses; JR Pass if leaving the city.',
      visa:'Visa-free for up to 90 days for most passports — confirm before booking.',
      etiquette:'No tipping. Bow lightly when greeting. Keep phone calls off trains. Remove shoes indoors.',
      mustVisit:['Senso-ji Temple','Shibuya Crossing','Shinjuku Gyoen','Hakone Open-Air Museum','Tsukiji Outer Market']
    },
    budget:[{id:uid(),category:'Flights',desc:'Round-trip flight',amount:820,date:start}],
    flights:[{id:uid(),airline:'ANA',bookingRef:'X7K2QR',from:'Home',to:'Tokyo (HND)',date:start,seats:'14A',luggage:'23kg checked + carry-on',insurance:'Yes',checkin:'Online 24h before',lounge:'No',status:'Booked'}],
    memories:[{id:uid(),type:'moment',text:'Booked the trip — first time in Japan!',date:todayStr()}]
  });
  trip.packing.lists['Weekend'][0].checked=false;
  return {
    trips:[trip],
    currentTripId: trip.id,
    bucketList:[
      {id:uid(),continent:'Global',country:'',city:'',experience:'Northern Lights',text:'See the Northern Lights',checked:false},
      {id:uid(),continent:'Global',country:'',city:'',experience:'Safari',text:'Go on an African safari',checked:false},
      {id:uid(),continent:'Global',country:'',city:'',experience:'Hot air balloon',text:'Hot air balloon ride at sunrise',checked:false},
      {id:uid(),continent:'Global',country:'',city:'',experience:'Scuba diving',text:'Scuba dive a coral reef',checked:false},
      {id:uid(),continent:'Global',country:'',city:'',experience:'Formula 1',text:'Watch an F1 race trackside',checked:false},
      {id:uid(),continent:'Global',country:'',city:'',experience:'Skiing',text:'Ski the Alps',checked:false}
    ],
    foodList:{
      'Japan':[{id:uid(),text:'Sushi',checked:false},{id:uid(),text:'Wagyu',checked:false},{id:uid(),text:'Ramen',checked:false}],
      'Italy':[{id:uid(),text:'Pasta',checked:false},{id:uid(),text:'Gelato',checked:false},{id:uid(),text:'Espresso',checked:false}],
      'Mexico':[{id:uid(),text:'Tacos',checked:false},{id:uid(),text:'Churros',checked:false}]
    },
    parks:[], unesco:[], kmTraveled:0, streak:'',
    currentView:'dashboard'
  };
}

/* ============ STATE / PERSISTENCE ============ */
const KEY='travelos_data_v1';
let DATA;
try{ const raw=localStorage.getItem(KEY); DATA = raw? JSON.parse(raw): defaultData(); }catch(e){ DATA = defaultData(); }
if(!DATA.trips) DATA = defaultData();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(DATA)); }catch(e){} }

let UI = { packingTab: DATA.trips[0]?DATA.trips[0].packing.selected:'Beach', creatorTab:'calendar', modal:null };

function currentTrip(){ return DATA.trips.find(t=>t.id===DATA.currentTripId) || null; }

/* ============ NAV CONFIG ============ */
const NAV = [
 {group:'Overview', items:[
   {id:'dashboard', label:'Dashboard', icon:'&#9678;'},

/* ============ SHELL RENDER ============ */
function render(){
  const root=document.getElementById('root');
  const trip=currentTrip();
  root.innerHTML = `
    <div class="app">
      <aside class="sidebar">
        <div class="sidebar-brand">
          <div class="kicker">Work Anywhere · Explore Everywhere</div>
          <h1>Travel OS</h1>
          <div class="tagline">Plan it. Live it. Remember it.</div>
        </div>
        <nav class="board">
          ${NAV.map(g=>`
            <div class="board-label">${g.group}</div>
            ${g.items.map(it=>`
              <div class="nav-item ${DATA.currentView===it.id?'active':''}" onclick="goTo('${it.id}')">
                <span class="ic">${it.icon}</span><span>${it.label}</span>
              </div>
            `).join('')}
          `).join('')}
        </nav>
        ${trip?`<div class="trip-pill"><b>${esc(trip.emoji||'✈️')} ${esc(trip.name||'Untitled trip')}</b>${fmtDate(trip.startDate)} → ${fmtDate(trip.endDate)}</div>`:''}

      </main>
    </div>
    ${UI.modal? renderModal(): ''}
  `;
}

function renderTopbar(trip){
  const view = NAV.flatMap(g=>g.items).find(i=>i.id===DATA.currentView) || {label:'Dashboard'};
  return `
    <div class="topbar">
      <div>
        <div class="crumb">Travel OS ${trip && view.id!=='dashboard' && NAV[1].items.some(i=>i.id===view.id) ? '· '+esc(trip.name||'Trip') : ''}</div>
        <h2 class="view-title">${view.label}</h2>
      </div>
      <div class="trip-switcher">
        ${DATA.trips.length? `
        <select class="trip-select" onchange="switchTrip(this.value)">
          ${DATA.trips.map(t=>`<option value="${t.id}" ${t.id===DATA.currentTripId?'selected':''}>${esc(t.emoji)} ${esc(t.name||'Untitled')}</option>`).join('')}
        </select>`:''}
        <button class="btn primary" onclick="openTripModal()">+ New trip</button>
      </div>
    </div>
  `;
}

function goTo(id){
  const item = NAV.flatMap(g=>g.items).find(i=>i.id===id);
  if(item && item.needsTrip && !currentTrip()){ DATA.currentView='dashboard'; render(); return; }
  DATA.currentView=id; save(); render();
}
function switchTrip(id){ DATA.currentTripId=id; UI.packingTab = currentTrip().packing.selected; save(); render(); }

function renderView(trip){
  switch(DATA.currentView){
    case 'dashboard': return renderDashboard();
    case 'bucketlist': return renderBucketList();
    case 'food': return renderFoodList();
    case 'adventure': return renderAdventure();
    case 'destinations': return trip? renderDestination(trip): needTripEmpty();
    case 'itinerary': return trip? renderItinerary(trip): needTripEmpty();
    case 'budget': return trip? renderBudget(trip): needTripEmpty();
    case 'packing': return trip? renderPacking(trip): needTripEmpty();
    case 'flights': return trip? renderFlights(trip): needTripEmpty();
    case 'memories': return trip? renderMemories(trip): needTripEmpty();
    case 'nomad': return trip? renderNomad(trip): needTripEmpty();
    case 'creator': return trip? renderCreator(trip): needTripEmpty();
    default: return renderDashboard();
  }
}

function needTripEmpty(){
  return `<div class="empty"><div class="big">No trip selected</div>Create or select a trip from the dashboard to unlock this module.
  <div class="mt16"><button class="btn primary" onclick="openTripModal()">+ Create a trip</button></div></div>`;

function saveTripModal(){
  const vals = {
    emoji: document.getElementById('f_emoji').value.trim()||'✈️',
    name: document.getElementById('f_name').value.trim(),
    destinationCity: document.getElementById('f_city').value.trim(),
    destinationCountry: document.getElementById('f_country').value.trim(),
    startDate: document.getElementById('f_start').value,
    endDate: document.getElementById('f_end').value,
    currency: document.getElementById('f_currency').value.trim()||'USD',
    budgetTotal: Number(document.getElementById('f_budget').value)||0
  };
  if(UI.editTripId){
    Object.assign(DATA.trips.find(t=>t.id===UI.editTripId), vals);
  } else {
    const t = makeTrip(vals);
    DATA.trips.push(t);
    DATA.currentTripId = t.id;
  }
  UI.modal=null; save(); render();
}
function deleteTrip(id){
  if(!confirm('Delete this trip and all its data? This cannot be undone.')) return;
  DATA.trips = DATA.trips.filter(t=>t.id!==id);
  if(DATA.currentTripId===id) DATA.currentTripId = DATA.trips[0]? DATA.trips[0].id : null;
  UI.modal=null; save(); render();
}

/* ============ COMPUTED HELPERS ============ */
function tripStatus(t){
  if(!t.startDate||!t.endDate) return 'draft';
  const today=todayStr();
  if(today<t.startDate) return 'upcoming';
  if(today>t.endDate) return 'completed';
  return 'active';
}
function tripProgress(t){
  if(!t.startDate||!t.endDate) return 0;
  const status=tripStatus(t);
  if(status==='upcoming') return 0;
  if(status==='completed') return 100;
  const total=daysBetween(t.startDate,t.endDate)||1;
  const elapsed=daysBetween(t.startDate,todayStr());
  return Math.max(0,Math.min(100,Math.round(elapsed/total*100)));
}
function budgetSpent(t){ return (t.budget||[]).reduce((s,b)=>s+(Number(b.amount)||0),0); }
function packingStats(t){
  let total=0,done=0;
  (t.documents||[]).forEach(d=>{total++;if(d.status==='done')done++;});
  Object.values(t.packing.lists).forEach(list=>{ list.forEach(i=>{total++;if(i.checked)done++;}); });
  return {total,done,pct: total? Math.round(done/total*100):0};
}
function nextFlight(t){
  const fl=(t.flights||[]).slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const upcoming = fl.find(f=>(f.date||'')>=todayStr());
  return upcoming || fl[fl.length-1] || null;
}

/* ============ DASHBOARD ============ */
function renderDashboard(){
  const trips=DATA.trips;
  const active = trips.filter(t=>tripStatus(t)!=='completed');
  const completed = trips.filter(t=>tripStatus(t)==='completed');
  return `
    <div class="view-sub">Every trip, at a glance — countdowns, budgets, packing status, and what's next.</div>
    <div class="section mt16">
      <div class="section-head"><h3>Upcoming &amp; active trips</h3><span class="hint">${active.length} trip${active.length!==1?'s':''}</span></div>
      ${active.length? `<div class="grid cols-2">${active.map(t=>tripPassCard(t)).join('')}</div>` : `
        <div class="empty"><div class="big">No trips yet</div>Start planning your next adventure.
        <div class="mt16"><button class="btn primary" onclick="openTripModal()">+ Create your first trip</button></div></div>
      `}
    </div>
    ${completed.length? `
    <div class="section">
      <div class="section-head"><h3>Completed trips</h3><span class="hint">${completed.length} logged</span></div>
      <div class="grid cols-2">${completed.map(t=>tripPassCard(t)).join('')}</div>
    </div>`:''}
  `;
}

function tripPassCard(t){
  const status=tripStatus(t);
  const days=t.startDate? daysBetween(todayStr(),t.startDate):null;
  const spent=budgetSpent(t);
  const pack=packingStats(t);
  const nf=nextFlight(t);
  const prog=tripProgress(t);
  let countLabel='DEPARTS IN', countVal='—';
  if(status==='upcoming'){ countVal=days; countLabel='DAYS TO GO'; }
  else if(status==='active'){ countVal='NOW'; countLabel='TRIP LIVE'; }
  else if(status==='completed'){ countVal='✓'; countLabel='COMPLETED'; }
  else { countVal='—'; countLabel='SET DATES'; }
  return `
  <div class="pass" onclick="switchTrip('${t.id}');goTo('destinations')">
    <div class="pass-main">
      <div class="flex-between">
        <div class="pass-eyebrow">${status.toUpperCase()} · ${esc(t.destinationCountry||'—')}</div>
        <button class="btn small" onclick="event.stopPropagation();editTripModal('${t.id}')">Edit</button>
      </div>
      <div class="pass-dest">${esc(t.emoji)} ${esc(t.name||'Untitled trip')}</div>
      <div class="pass-meta">
        <span>&#128197; <b>${fmtDate(t.startDate)}</b> → <b>${fmtDate(t.endDate)}</b></span>
        <span>&#128176; <b>${fmtMoney(spent,t.currency)}</b> / ${fmtMoney(t.budgetTotal,t.currency)}</span>
        <span>&#127755; ${esc(t.weather.note)||'No weather notes yet'}</span>
        <span>&#9992; ${nf? esc(nf.airline+' · '+(nf.status||'Booked')) : 'No flights added'}</span>
      </div>
      <div class="pass-progress"><i style="width:${prog}%"></i></div>
    </div>
    <div class="pass-divider"></div>
    <div class="pass-stub">
      <div class="count">${countVal}</div>
      <div class="count-l">${countLabel}</div>
      <div class="count-l mt8">${pack.pct}% PACKED</div>
    </div>
  </div>`;
}

/* ============ ITINERARY BUILDER ============ */
function ensureItineraryDays(t){
  if(!t.startDate||!t.endDate) return;
  const span=daysBetween(t.startDate,t.endDate);
  if(span<0) return;
  const existing={}; t.itinerary.forEach(d=>existing[d.date]=d);
  const days=[];
  for(let i=0;i<=span;i++){
    const date=addDays(t.startDate,i);
    days.push(existing[date] || {id:uid(),date,morning:'',afternoon:'',evening:'',mapsLink:'',reservations:'',activityBookings:'',dayBudget:''});
  }
  t.itinerary=days;
}
function renderItinerary(t){
  if(t.itinerary.length===0 && t.startDate && t.endDate) ensureItineraryDays(t);
  if(!t.startDate||!t.endDate){
    return `<div class="empty"><div class="big">Set trip dates first</div>Add a start and end date to generate a day-by-day itinerary.
    <div class="mt16"><button class="btn primary" onclick="editTripModal('${t.id}')">Set dates</button></div></div>`;
  }
  const dailyTotal = t.itinerary.reduce((s,d)=>s+(Number(d.dayBudget)||0),0);
  return `
  <div class="view-sub">Day-by-day plan for ${esc(t.name)} — ${t.itinerary.length} day${t.itinerary.length!==1?'s':''} · planned daily spend ${fmtMoney(dailyTotal,t.currency)}</div>
  <div class="mt16">
  ${t.itinerary.map((d,i)=>`
    <div class="dayblock">
      <div class="daybar">
        <div><span class="dnum">Day ${i+1}</span><div class="ddate">${fmtDate(d.date)}</div></div>
        <a class="btn small" target="_blank" href="${d.mapsLink||('https://www.google.com/maps/search/'+encodeURIComponent(t.destinationCity||''))}">Open maps ↗</a>
      </div>
      <div class="dayslots">
        <div class="dayslot"><div class="slotlabel">Morning</div><textarea placeholder="Plans for the morning..." onchange="updDay('${d.id}','morning',this.value)">${esc(d.morning)}</textarea></div>
        <div class="dayslot"><div class="slotlabel">Afternoon</div><textarea placeholder="Plans for the afternoon..." onchange="updDay('${d.id}','afternoon',this.value)">${esc(d.afternoon)}</textarea></div>
        <div class="dayslot"><div class="slotlabel">Evening</div><textarea placeholder="Plans for the evening..." onchange="updDay('${d.id}','evening',this.value)">${esc(d.evening)}</textarea></div>
      </div>
      <div class="dayextra">
        <div class="field"><label>Maps link</label><input value="${esc(d.mapsLink)}" placeholder="Paste link" onchange="updDay('${d.id}','mapsLink',this.value)"></div>
        <div class="field"><label>Reservations</label><input value="${esc(d.reservations)}" placeholder="Restaurant, time" onchange="updDay('${d.id}','reservations',this.value)"></div>
        <div class="field"><label>Activity bookings</label><input value="${esc(d.activityBookings)}" placeholder="Tour, ticket" onchange="updDay('${d.id}','activityBookings',this.value)"></div>
        <div class="field"><label>Budget for the day</label><input type="number" value="${d.dayBudget}" placeholder="0" onchange="updDay('${d.id}','dayBudget',this.value)"></div>
      </div>
    </div>
  `).join('')}
  </div>`;
}
function updDay(id,field,val){
  const d=currentTrip().itinerary.find(x=>x.id===id);
  d[field]= field==='dayBudget'? Number(val)||0 : val;
  save();
}

/* ============ BUDGET TRACKER ============ */
function renderBudget(t){
  const spent=budgetSpent(t);
  const remaining=(Number(t.budgetTotal)||0)-spent;
  const byCat={};
  BUDGET_CATEGORIES.forEach(c=>byCat[c]=0);
  t.budget.forEach(b=>{ byCat[b.category]=(byCat[b.category]||0)+(Number(b.amount)||0); });
  const maxCat=Math.max(1,...Object.values(byCat));
  return `
  <div class="view-sub">Track every expense against your ${fmtMoney(t.budgetTotal,t.currency)} budget for ${esc(t.name)}.</div>
  <div class="grid cols-3 mt16">
    <div class="stat-card"><div class="n">${fmtMoney(spent,t.currency)}</div><div class="l">Live trip total</div></div>
    <div class="stat-card"><div class="n" style="color:${remaining<0?'var(--red)':'var(--green)'}">${fmtMoney(remaining,t.currency)}</div><div class="l">${remaining<0?'Over budget':'Remaining'}</div></div>
    <div class="stat-card"><div class="n">${fmtMoney(t.budgetTotal,t.currency)}</div><div class="l">Total budget</div></div>
  </div>

  <div class="section mt16">
    <div class="section-head"><h3>By category</h3></div>
    <div class="card">
      ${BUDGET_CATEGORIES.map(c=>`
        <div class="mt8" style="margin-bottom:10px;">
          <div class="flex-between mono" style="font-size:12px;margin-bottom:4px;"><span>${c}</span><span>${fmtMoney(byCat[c],t.currency)}</span></div>
          <div class="pass-progress"><i style="width:${Math.round(byCat[c]/maxCat*100)}%;background:var(--blue);"></i></div>
        </div>
      `).join('')}
    </div>
  </div>

  <div class="section">
    <div class="section-head"><h3>Expenses</h3><span class="hint">${t.budget.length} entries</span></div>
    <div class="card">
      <table>
        <thead><tr><th>Category</th><th>Description</th><th>Date</th><th>Amount</th><th></th></tr></thead>
        <tbody>
          ${t.budget.map(b=>`
            <tr>
              <td><select onchange="updBudget('${b.id}','category',this.value)">${BUDGET_CATEGORIES.map(c=>`<option ${c===b.category?'selected':''}>${c}</option>`).join('')}</select></td>
              <td><input value="${esc(b.desc)}" placeholder="What was it for?" onchange="updBudget('${b.id}','desc',this.value)"></td>
              <td><input type="date" value="${b.date||''}" onchange="updBudget('${b.id}','date',this.value)"></td>
              <td class="num"><input type="number" value="${b.amount}" onchange="updBudget('${b.id}','amount',this.value)"></td>
              <td><button class="btn small danger" onclick="delBudget('${b.id}')">✕</button></td>
            </tr>
          `).join('')}
          <tr class="total-row"><td colspan="3">TOTAL</td><td class="num">${fmtMoney(spent,t.currency)}</td><td></td></tr>
        </tbody>
      </table>
      <div class="mt16"><button class="btn primary" onclick="addBudget()">+ Add expense</button></div>
    </div>
  </div>`;
}
function addBudget(){
  currentTrip().budget.push({id:uid(),category:'Food',desc:'',amount:0,date:todayStr()});
  save(); render();
}
function updBudget(id,field,val){
  const b=currentTrip().budget.find(x=>x.id===id);
  b[field]= field==='amount'? Number(val)||0 : val;
  save(); render();
}
function delBudget(id){ const t=currentTrip(); t.budget=t.budget.filter(b=>b.id!==id); save(); render(); }

/* ============ PACKING OS ============ */

  const tabs=Object.keys(t.packing.lists);
  const active = UI.packingTab && tabs.includes(UI.packingTab) ? UI.packingTab : tabs[0];
  const docsChecked=t.documents.filter(d=>d.status==='done').length;
  const list=t.packing.lists[active];
  const listChecked=list.filter(i=>i.checked).length;
  return `
  <div class="view-sub">One checklist per trip type, not one checklist for everything. Switch templates below.</div>

  <div class="section mt16">
    <div class="section-head"><h3>Travel documents</h3><span class="hint">${docsChecked}/${t.documents.length} ready</span></div>
    <div class="card">
      ${t.documents.map(d=>`
        <div class="checklist-item ${d.status==='done'?'checked':''}">
          <input type="checkbox" ${d.status==='done'?'checked':''} onchange="toggleDoc('${d.id}')">
          <span class="txt">${esc(d.name)}</span>
          <button class="del" onclick="delDoc('${d.id}')">✕</button>
        </div>
      `).join('')}
      <div class="addrow">
        <input id="doc_input" placeholder="Add a document..." onkeydown="if(event.key==='Enter')addDoc()">
        <button class="btn" onclick="addDoc()">Add</button>
      </div>
    </div>
  </div>

  <div class="section">

function toggleBucket(id){ const b=DATA.bucketList.find(x=>x.id===id); b.checked=!b.checked; save(); render(); }

          <tr>
            <td><input value="${esc(row.brand)}" onchange="updCreatorRow('collabs','${row.id}','brand',this.value)"></td>
            <td><select onchange="updCreatorRow('collabs','${row.id}','status',this.value)">${['Pitched','Negotiating','Confirmed','Delivered','Paid'].map(p=>`<option ${p===row.status?'selected':''}>${p}</option>`).join('')}</select></td>
            <td><input value="${esc(row.deliverable)}" onchange="updCreatorRow('collabs','${row.id}','deliverable',this.value)"></td>
            <td><input type="date" value="${row.deadline||''}" onchange="updCreatorRow('collabs','${row.id}','deadline',this.value)"></td>
            <td><button class="btn small danger" onclick="delCreatorRow('collabs','${row.id}')">✕</button></td>
          </tr>`).join('')}
      </tbody>
    </table>
    <div class="mt16"><button class="btn primary" onclick="addCreatorRow('collabs',{brand:'',status:'Pitched',deliverable:'',deadline:''})">+ Add collab</button></div>`;
  }
  if(tab==='costs'){
    const total=c.costs.reduce((s,r)=>s+(Number(r.amount)||0),0);
    return `
    <table>
      <thead><tr><th>Item</th><th>Amount</th><th></th></tr></thead>
      <tbody>
        ${c.costs.map(row=>`
          <tr>
            <td><input value="${esc(row.item)}" placeholder="e.g. Drone insurance" onchange="updCreatorRow('costs','${row.id}','item',this.value)"></td>
            <td class="num"><input type="number" value="${row.amount}" onchange="updCreatorRow('costs','${row.id}','amount',this.value)"></td>
            <td><button class="btn small danger" onclick="delCreatorRow('costs','${row.id}')">✕</button></td>
          </tr>`).join('')}
        <tr class="total-row"><td>TOTAL</td><td class="num">${fmtMoney(total,t.currency)}</td><td></td></tr>
      </tbody>
    </table>
    <div class="mt16"><button class="btn primary" onclick="addCreatorRow('costs',{item:'',amount:0})">+ Add cost</button></div>`;
  }
  return '';
}
function addCreatorRow(list,obj){ currentTrip().creator[list].push(Object.assign({id:uid()},obj)); save(); render(); }
function updCreatorRow(list,id,field,val){
  const row=currentTrip().creator[list].find(r=>r.id===id);
  row[field]= field==='amount'? Number(val)||0 : val;
  save(); if(field==='amount') render();
}
function delCreatorRow(list,id){ const t=currentTrip(); t.creator[list]=t.creator[list].filter(r=>r.id!==id); save(); render(); }
function toggleCreatorItem(list,id){ const r=currentTrip().creator[list].find(x=>x.id===id); r.checked=!r.checked; save(); render(); }
function addSimpleItem(list,inputId){
  const inp=document.getElementById(inputId); const v=inp.value.trim(); if(!v) return;
  currentTrip().creator[list].push({id:uid(),text:v,checked:false}); save(); render();
}

/* ============ BOOT ============ */
render();
</script>
</body>
</html>
